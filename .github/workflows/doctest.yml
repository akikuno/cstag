name: Doctest

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  group: doctest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=9.1.1,<10"
      - name: Run source doctests
        run: >-
          python -m pytest --doctest-modules --doctest-glob=README.md
          README.md src/cstag -W error
