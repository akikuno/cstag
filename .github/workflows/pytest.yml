name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=9.1.1,<10"
      - name: Run tests
        run: python -m pytest tests -W error

  minimum-dependencies:
    name: Minimum dependencies on Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install minimum dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "matplotlib==3.10.9" "pytest==9.1.1"
          python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m pytest tests -W error

  quality:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "mypy>=2.3.1,<3" "ruff>=0.16.5,<0.17"
      - name: Check formatting and lint
        run: |
          ruff format --check .
          ruff check .
      - name: Check types
        run: mypy

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.6,<2"
          python -m build
      - name: Smoke-test wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import cstag; assert callable(cstag.call)"
