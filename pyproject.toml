[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "cstag"
version = "1.1.2"
description = "Python library tailored for manipulating and visualizing minimap2's cs tags"
authors = [
    { name = "Akihiro Kuno", email = "akuno@md.tsukuba.ac.jp" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "matplotlib>=3.10.9,<4.0",
]

[project.urls]
Homepage = "https://github.com/akikuno/cstag"
Repository = "https://github.com/akikuno/cstag"
Documentation = "https://akikuno.github.io/cstag/"

[dependency-groups]
dev = [
    "build>=1.6,<2",
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.5,<0.17",
]
docs = [
    "pdoc>=16,<17",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--ignore=examples",
    "--verbose",
    "-ra",
    "--color=yes",
]
doctest_optionflags = "NORMALIZE_WHITESPACE"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PERF",
    "PIE",
    "PT",
    "RUF",
    "SIM",
    "UP",
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
no_site_packages = true

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true
